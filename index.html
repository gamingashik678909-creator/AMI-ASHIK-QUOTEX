<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3-Candle Outlook</title>
<style>
:root{--bg:#0f1318;--panel:#171d25;--line:#263040;--tx:#e6ebf2;--mut:#8a97a8;--up:#35c49b;--dn:#ee6a6a;--am:#e3b341;--ac:#6ea8ff;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f1ec;--panel:#fff;--line:#d9d5cb;--tx:#1b2430;--mut:#667385;--up:#0f8f6a;--dn:#cc3b3b;--am:#a9770a;--ac:#2563c9;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 24px}
main{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}h1{font-size:18px;margin:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--up)}.dot.bad{background:var(--dn)}
button,select,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
button{cursor:pointer}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.bar .grow{flex:1;min-width:140px;text-align:left}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}.warn{border-color:var(--am);color:var(--am)}.err{border-color:var(--dn)}
canvas{width:100%;height:260px;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--mut);border-radius:10px;padding:10px;min-width:0}
.card.UP{border-top-color:var(--up)}.card.DOWN{border-top-color:var(--dn)}
.dir{font-size:22px;font-weight:700}.UP .dir{color:var(--up)}.DOWN .dir{color:var(--dn)}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.badge.am{color:var(--am);border-color:var(--am)}.badge.up{color:var(--up);border-color:var(--up)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px 2px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
h2{font-size:15px;margin:0 0 6px}
dialog{width:min(94vw,520px);max-height:80vh;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px}
dialog::backdrop{background:#0009}#list{max-height:55vh;overflow:auto;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.row .n{flex:1;min-width:0}.row .n small{color:var(--mut)}
.star{background:none;border:0;font-size:20px;padding:0 6px;min-height:0}
@media(max-width:520px){.dir{font-size:19px}.card{padding:8px}}
</style>
</head>
<body>
<main>
<header><h1>3-Candle Outlook</h1><span id="dot" class="dot"></span><span id="conn" class="mut">connecting</span><button id="theme" aria-label="Toggle theme">◐</button></header>
<div class="bar">
  <select id="venue" aria-label="Book"></select>
  <button id="pairBtn" class="grow">Choose pair</button>
  <select id="tf" aria-label="Timeframe"></select>
</div>
<div class="bar"><button id="refresh" class="pri">Refresh</button><label class="mut"><input type="checkbox" id="auto"> Auto-refresh</label><span id="meta" class="mut"></span></div>
<div id="msg"></div>
<div class="panel"><canvas id="chart"></canvas><div id="legend" class="mut"></div></div>
<div class="cards" id="cards"></div>
<div class="panel" id="trend"></div>
<div class="panel"><h2>Indicators</h2><table id="ind"></table></div>
<div class="panel"><h2>Score breakdown</h2><table id="comp"></table></div>
<div class="panel"><h2>Backtest (walk-forward)</h2><div id="bt" class="mut">Run an analysis first.</div></div>
<div class="panel warn" id="foot">Predictions are statistical estimates, not guarantees. OTC prices are generated by the broker and do not track the real market. This tool reads prices only and never places trades.</div>
<div class="mut" id="usage"></div>
</main>
<dialog id="dlg"><div class="bar"><input id="q" class="grow" placeholder="Search pairs" autocomplete="off"><button id="close">Close</button></div><label class="mut"><input type="checkbox" id="favOnly"> Favorites only</label><div id="list"></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={venue:null,symbol:null,tf:60,pairs:[],favs:[],data:null,timer:null,busy:false,usage:null};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(_){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const tfName=t=>t>=86400?t/86400+'d':t>=3600?t/3600+'h':t>=60?t/60+'m':t+'s';
const pct=x=>x==null?'–':(x*100).toFixed(1)+'%',clock=t=>new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
async function api(path){const r=await fetch(path),j=await r.json().catch(()=>({error:'Bad response from server'}));if(!r.ok){const e=new Error(j.error||'Request failed');e.hint=j.hint;e.status=r.status;throw e}return j}
function showErr(e){$('msg').innerHTML=`<div class="panel err"><b>${esc(e.message)}</b><div class="mut">${esc(e.hint||'')}</div></div>`;$('dot').className='dot bad';$('conn').textContent='error '+(e.status||'')}
function setTheme(t){document.documentElement.dataset.theme=t;LS.set('theme',t);S.data&&drawChart()}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
setTheme(LS.get('theme',matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));

async function init(){
  try{
    const st=await api('/api/status');S.usage=st.usage;showUsage();
    const open=st.venues.filter(v=>v.open),names={otc:'Pocket Option',quotex:'Quotex',iq:'IQ Option',binodex:'BinoDex',forex:'Real market'};
    if(!open.length)throw Object.assign(new Error('Your plan opens no books'),{hint:'Pick a book on otcharts.com/account.'});
    S.venues=open;$('venue').innerHTML=open.map(v=>`<option value="${v.id}">${names[v.id]||v.id}</option>`).join('');
    S.venue=LS.get('venue',null);if(!open.some(v=>v.id===S.venue))S.venue=(open.find(v=>v.id==='quotex')||open[0]).id;
    $('venue').value=S.venue;$('dot').className='dot ok';$('conn').textContent='API connected';
    await setVenue();
  }catch(e){showErr(e)}
}
async function setVenue(){
  LS.set('venue',S.venue);S.favs=LS.get('favs:'+S.venue,[]);
  const v=S.venues.find(x=>x.id===S.venue),tfs=v.timeframes||[5,15,30,60,300];
  S.tf=LS.get('tf',60);if(!tfs.includes(S.tf))S.tf=tfs.includes(60)?60:tfs[0];
  $('tf').innerHTML=tfs.map(t=>`<option value="${t}">${tfName(t)}</option>`).join('');$('tf').value=S.tf;
  const c=LS.get('pairs:'+S.venue,null);
  if(c&&Date.now()-c.t<3600e3)S.pairs=c.s;else{const d=await api('/api/pairs?venue='+S.venue);S.pairs=d.symbols;LS.set('pairs:'+S.venue,{t:Date.now(),s:S.pairs})}
  const want=LS.get('sym:'+S.venue,null);
  S.symbol=S.pairs.some(p=>p.symbol===want)?want:(S.pairs.find(p=>p.open!==false)||S.pairs[0]||{}).symbol;
  if(!S.symbol){$('msg').innerHTML='<div class="panel err">This book returned no pairs for your plan.</div>';return}
  $('pairBtn').textContent=S.symbol;run();
}
async function run(){
  if(S.busy||!S.symbol)return;S.busy=true;$('refresh').disabled=true;$('refresh').textContent='Loading…';$('msg').innerHTML='';
  try{
    const p=S.pairs.find(x=>x.symbol===S.symbol)||{};
    const d=await api(`/api/signal?venue=${S.venue}&symbol=${encodeURIComponent(S.symbol)}&tf=${S.tf}${p.payout?'&payout='+p.payout:''}`);
    S.data=d;$('dot').className='dot ok';$('conn').textContent='API connected';render(p);
    refreshUsage();
  }catch(e){showErr(e);if(e.status===404||e.status===403)$('msg').innerHTML+='<div class="mut">Tip: choose a different pair from the list.</div>'}
  finally{S.busy=false;$('refresh').disabled=false;$('refresh').textContent='Refresh'}
}
async function refreshUsage(){try{S.usage=(await api('/api/status?only=usage')).usage;showUsage()}catch(_){}}
function showUsage(){const r=S.usage&&S.usage.requests;if(!r)return;$('usage').textContent=`API quota: ${r.remaining} of ${r.quota} requests left (${r.per==='month'?'free month':'per day'}), resets ${new Date(r.resets*1000).toLocaleString()}`;if(r.remaining<25)$('usage').style.color='var(--am)'}

function render(p){
  const {meta,analysis:a}=S.data;
  $('meta').textContent=`${meta.cached?'cached · ':''}updated ${clock(meta.fetchedAt)}`+(meta.open===false?' · pair CLOSED':'');
  if(meta.open===false)$('msg').innerHTML='<div class="panel warn">The broker has closed this pair right now. Its prices may keep moving but it cannot be traded.</div>';
  if(!a.ok){$('cards').innerHTML='';$('trend').textContent=a.reason;drawChart();return}
  $('cards').innerHTML=a.predictions.map(cardHtml).join('');
  const kind=p.isOtc===false?'Regular market':'OTC';
  $('trend').innerHTML=`<b>${a.trend.label}</b> · ${a.trend.regime} (ADX ${a.trend.adx}) · <span class="badge">${kind}</span>${p.payout?` · payout ${p.payout}% (break-even ${pct(a.breakEven)})`:''}
  <div class="mut">Analysed ${clock(a.analyzedAt)} on closed candles up to ${clock(a.lastClosedTime+(S.data.meta.clockOffset||0)+S.tf)} · data age ${a.dataAgeSec}s${a.stale?' · <b style="color:var(--am)">STALE</b>':''}${a.gapNearEnd?' · <b style="color:var(--am)">gap in recent data</b>':''}${meta.gaps&&meta.gaps.runs?` · ${meta.gaps.runs} gap(s) in window`:''}</div>`;
  $('ind').innerHTML=Object.entries(a.indicators).map(([k,v])=>`<tr><td>${k}</td><td>${v??'–'}</td></tr>`).join('');
  $('comp').innerHTML='<tr><th>Component</th><th>Signal × weight</th></tr>'+a.components.map(c=>`<tr><td>${esc(c.name)}</td><td style="color:var(--${c.contribution>0?'up':c.contribution<0?'dn':'mut'})">${c.contribution>0?'+':''}${c.contribution}</td></tr>`).join('');
  const b=a.backtest;
  $('bt').innerHTML=!b.ok?esc(b.reason):`<div>${b.candles} closed ${tfName(S.tf)} candles. Threshold tuned on the first 60%, scored on the last 40% (from ${clock(b.testStart)}). No future data used.</div><table><tr><th>Candle</th><th>Threshold</th><th>Tested</th><th>Accuracy (95% range)</th></tr>${b.horizons.map(h=>`<tr><td>+${h.k}</td><td>${h.theta}</td><td>${h.tested}</td><td>${h.accuracy==null?'–':pct(h.accuracy)+' ('+pct(h.ci95[0])+'–'+pct(h.ci95[1])+')'}</td></tr>`).join('')}</table><div>Samples are small; a range that includes 50% means no proven edge. Past results do not promise future results.</div>`;
  drawChart();tick();
}
function cardHtml(p){
  const v=p.validation;let conf;
  if(p.direction==='UNCERTAIN')conf=`<span class="mut">${esc(p.reason||'')}</span>`;
  else if(v.insufficientSample)conf=`<span class="badge am">Not validated</span><div class="mut">Only ${v.n} test calls (need 30)</div>`;
  else conf=`<span class="badge ${v.edgeProven?'up':'am'}">${v.edgeProven?'Edge above 50%':'No proven edge'}</span><div class="mut">Tested hit rate ${pct(v.accuracy)} over ${v.n} calls (${pct(v.ci95[0])}–${pct(v.ci95[1])})${v.beatsBreakEven===false?'<br>Below payout break-even':''}</div>`;
  return `<div class="card ${p.direction}"><div class="mut">Candle ${p.k}</div><div class="dir">${p.direction==='UP'?'▲ UP':p.direction==='DOWN'?'▼ DOWN':'? UNSURE'}</div>${conf}<div class="mut cd" data-t="${p.opensAt}"></div></div>`;
}
function tick(){document.querySelectorAll('.cd').forEach(el=>{const t=+el.dataset.t,d=t-Math.floor(Date.now()/1000);el.textContent=d>0?`Opens ${clock(t)} (in ${d}s)`:`Opened ${clock(t)} (${-d}s ago)`})}
setInterval(tick,1000);

function drawChart(){
  const cv=$('chart'),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const cs=(S.data&&S.data.candles||[]).slice(-70);if(!cs.length)return;
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const a=S.data.analysis,lv=a.ok?a.levels:{};
  let hi=Math.max(...cs.map(c=>c.high)),lo=Math.min(...cs.map(c=>c.low));const pad=(hi-lo)*.05||hi*1e-4;hi+=pad;lo-=pad;
  const X=i=>8+(i+.5)*(w-60)/cs.length,Y=v=>6+(hi-v)*(h-12)/(hi-lo),bw=Math.max(2,(w-60)/cs.length*.65);
  g.font='11px system-ui';g.fillStyle=col('--mut');g.strokeStyle=col('--line');
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(0,y);g.lineTo(w-50,y);g.stroke();g.fillText(v.toFixed(v>100?2:5),w-50,y+4)}
  const line=(arr,c)=>{if(!arr)return;g.strokeStyle=c;g.lineWidth=1.2;g.beginPath();let on=false;const off=arr.length-cs.length;cs.forEach((_,i)=>{const v=arr[i+off];if(v==null)return;on?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v));on=true});g.stroke()};
  if(a.ok){const n=S.data.candles.length-cs.length,o=a.overlay;/* overlay aligns to closed bars; trim to the last bars shown */
    const closedShown=a.formingBarExcluded?cs.length-1:cs.length;[['ema9',col('--ac')],['ema21',col('--am')],['ema50',col('--mut')]].forEach(([k,c])=>{const arr=o[k].slice(-closedShown);line(Array(cs.length-closedShown).fill(null).concat(arr),c)});}
  [[lv.support,col('--up')],[lv.resistance,col('--dn')]].forEach(([v,c])=>{if(v==null)return;g.strokeStyle=c;g.setLineDash([4,4]);g.beginPath();g.moveTo(0,Y(v));g.lineTo(w-50,Y(v));g.stroke();g.setLineDash([])});
  cs.forEach((c,i)=>{const up=c.close>=c.open,k=up?col('--up'):col('--dn'),forming=i===cs.length-1&&a.formingBarExcluded;g.globalAlpha=forming?.45:1;g.strokeStyle=g.fillStyle=k;g.lineWidth=1;
    g.beginPath();g.moveTo(X(i),Y(c.high));g.lineTo(X(i),Y(c.low));g.stroke();const y1=Y(Math.max(c.open,c.close)),y2=Y(Math.min(c.open,c.close));g.fillRect(X(i)-bw/2,y1,bw,Math.max(1,y2-y1))});g.globalAlpha=1;
  $('legend').innerHTML=`<span style="color:var(--ac)">EMA9</span> <span style="color:var(--am)">EMA21</span> EMA50 · dashed: <span style="color:var(--up)">support</span> / <span style="color:var(--dn)">resistance</span> · faded bar = still forming`;
}
addEventListener('resize',()=>S.data&&drawChart());

/* pair picker */
function openPicker(){$('dlg').showModal();$('q').value='';drawList();$('q').focus()}
function drawList(){
  const q=$('q').value.trim().toLowerCase(),fo=$('favOnly').checked;
  const rows=S.pairs.filter(p=>(!fo||S.favs.includes(p.symbol))&&(p.symbol+' '+(p.name||'')).toLowerCase().includes(q))
   .sort((a,b)=>(S.favs.includes(b.symbol)-S.favs.includes(a.symbol))||((b.open!==false)-(a.open!==false))||a.symbol.localeCompare(b.symbol)).slice(0,300);
  $('list').innerHTML=rows.length?rows.map(p=>`<div class="row" data-s="${esc(p.symbol)}"><button class="star" data-f="${esc(p.symbol)}" aria-label="Favorite">${S.favs.includes(p.symbol)?'★':'☆'}</button><div class="n">${esc(p.symbol)}<br><small>${esc(p.name||'')}</small></div><span class="badge">${p.isOtc===false?'Market':'OTC'}</span>${p.payout?`<span class="badge">${p.payout}%</span>`:''}${p.open===false?'<span class="badge am">closed</span>':''}</div>`).join(''):'<div class="mut">No pairs match. The list shows only what your plan can read.</div>';
}
$('list').onclick=e=>{const f=e.target.closest('[data-f]');if(f){const s=f.dataset.f;S.favs=S.favs.includes(s)?S.favs.filter(x=>x!==s):[...S.favs,s];LS.set('favs:'+S.venue,S.favs);drawList();return}
  const r=e.target.closest('.row');if(r){S.symbol=r.dataset.s;LS.set('sym:'+S.venue,S.symbol);$('pairBtn').textContent=S.symbol;$('dlg').close();run()}};
$('q').oninput=drawList;$('favOnly').onchange=drawList;$('close').onclick=()=>$('dlg').close();$('pairBtn').onclick=openPicker;
$('venue').onchange=e=>{S.venue=e.target.value;setVenue().catch(showErr)};
$('tf').onchange=e=>{S.tf=+e.target.value;LS.set('tf',S.tf);run();setAuto()};
$('refresh').onclick=run;$('auto').onchange=setAuto;
function setAuto(){clearInterval(S.timer);if($('auto').checked){const ms=Math.max(30,S.tf)*1000;S.timer=setInterval(()=>{const r=S.usage&&S.usage.requests;if(document.hidden||(r&&r.remaining<25))return;run()},ms)}}
init();
</script>
</body>
</html>
